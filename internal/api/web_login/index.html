<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPG3D</title><script src="/account/login.js" defer></script></head>
<body><main><select id="language" ><option value="ru" data-text="ru_label"></option><option value="en" data-text="en_label"></option></select><h1 data-text="title"></h1><p data-text="intro"></p><p data-text="warning"></p>
<form id="request-form"><label><span data-text="player"></span> <input name="player_id" inputmode="numeric" pattern="[0-9]{1,32}" maxlength="32" required></label><button data-text="request"></button></form>
<form id="verify-form" hidden><label><span data-text="code"></span> <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{8}" maxlength="8" required></label><button data-text="verify"></button><button id="cancel" type="button" data-text="cancel"></button></form>
<p id="status" role="status" aria-live="polite"></p><button id="logout" hidden data-text="logout"></button></main></body></html>
